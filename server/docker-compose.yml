services:
  quote-service:
    build:
      context: .
      args:
        # Defaults to the OrcaSlicer release the profiles were verified
        # against. Override ORCA_URL only to move off it.
        # https://github.com/SoftFever/OrcaSlicer/releases
        ORCA_URL: "${ORCA_URL-}"
    ports:
      - "8080:8080"
    environment:
      # Lock this down to your site's origin in production.
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      MAX_CONCURRENT_SLICES: "2"
      SLICE_TIMEOUT_MS: "180000"
      MAX_UPLOAD_BYTES: "104857600"
    volumes:
      # Mount your real exported profiles over the placeholders.
      - ./profiles:/app/profiles:ro
    tmpfs:
      # Uploads and slice scratch never need to survive a restart, and keeping
      # customer models off disk is one less thing to secure.
      - /tmp:size=2g
    restart: unless-stopped
    # Slicing is CPU-bound; give it room but don't let it eat the host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
